services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devscope
      POSTGRES_PASSWORD: devscope
      POSTGRES_USER: devscope
    ports:
      - "5432:5432"
    volumes:
      - devscope-postgres:/var/lib/postgresql/data
      - ./packages/db/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devscope -d devscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devscope-postgres:
